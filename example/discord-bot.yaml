# Valid output configuration. Replace synthetic IDs and set the token environment variable.
# Merge your LLM/provider and VCS credentials before enabling review commands.
# Command setup: docs/site/src/content/docs/en/integrations/discord.md
# Deploy the callback/public key before saving the Interactions Endpoint URL; register the guild command separately.
im:
  connections:
    bot:
      kind: discord_bot
      application_id: "123456789012345678"
      guild_id: "123456789012345679"
      token_env: AICR_DISCORD_TOKEN
  command_bindings:
    reviewers:
      enabled: false # Enable after configuring the callback, durable store and worker.
      connection: bot
      actors: [{ kind: conversation_users }]
      conversations: [{ kind: channel, id: "123456789012345680" }]
      commands: [help, chat-id, review, status]
      repositories:
        demo: { workspace: ws, source_trigger: git, repo_ref: org/demo }
triggers:
  - name: git
    kind: github
    repos: [org/demo]
workspaces:
  instances:
    ws:
      source_repo: { trigger: git, repo: org/demo }
      outputs:
        summary: [report]
outputs:
  channels:
    - name: report
      kind: discord_bot
      connection: bot
      channel_id: "123456789012345680"
      no_problems: { action: publish_if_summary }
      # Map a VCS author identity to a platform USER ID, never the Bot/chat ID.
      mention_author: true
      author_mappings: { "alice@example.org": "234567891" }
      # Optional: enable Server Members Intent before selecting the API directory.
      # member_directory: { source: discord_api, cache_ttl_seconds: 43200 }

