# Valid output configuration. Replace synthetic IDs and set the token environment variable.
# Merge your LLM/provider and VCS credentials before enabling review commands.
# Command setup: docs/site/src/content/docs/en/integrations/telegram.md
im:
  connections:
    bot:
      kind: telegram_bot
      bot_id: "123456789"
      token_env: AICR_TELEGRAM_TOKEN
  command_bindings:
    reviewers:
      enabled: false # Shared groups only; private chats require explicit user IDs.
      connection: bot
      actors: [{ kind: conversation_users }]
      conversations: [{ kind: group, id: "-1001234567890" }]
      commands: [help, chat-id, review, status]
      repositories:
        demo: { workspace: ws, source_trigger: git, repo_ref: org/demo }
triggers:
  - name: git
    kind: github
    repos: [org/demo]
workspaces:
  instances:
    ws:
      source_repo: { trigger: git, repo: org/demo }
      outputs:
        summary: [report]
outputs:
  channels:
    - name: report
      kind: telegram_bot
      connection: bot
      chat_id: "-1001234567890"
      no_problems: { action: publish_if_summary }

