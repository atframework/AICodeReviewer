# Browser-gate fixture for tests/browser (P6; P7 run isolation leg). Real CLI
# `serve` wiring: SQLite config store, file-owned entities for readonly/copy
# flows, dummy env secrets injected by playwright.config.ts webServer env.
# P6 specs never trigger a review: the provider URL stays unroutable (the
# direct-LLM path is never exercised). The P7 spec drives the agent path:
# trigger base URLs point at the in-process stub gitea services hosted by
# start-fixture.mjs (git smart-HTTP + captured /api/v1 writes), stub
# kilo/opencode CLIs shadow PATH, and the sandbox is pinned native so the
# agent child inherits the fixture PATH/env (a container engine would
# auto-detect otherwise and lose the stubs).
llm:
  providers:
    - id: file-llm
      kind: openai_compatible
      base_url: http://127.0.0.1:9/v1
      api_key_env: AICR_BROWSER_LLM_KEY
  model_chain:
    default:
      - { provider: file-llm, model: browser-test-model, role: any }
  default_model_chain: default

triggers:
  - name: git-main
    kind: gitea
    enabled: true
    base_url: http://127.0.0.1:9399
    token_env: AICR_BROWSER_GIT_TOKEN
    webhook_secret_env: AICR_BROWSER_GIT_SECRET
  # Separate v2 source: git-main is intentionally locked to its legacy binding.
  - name: git-preview
    kind: gitea
    base_url: http://127.0.0.1:9398
    token_env: AICR_BROWSER_GIT_TOKEN
    # Distinct secret: with one shared secret both gitea triggers authenticate
    # every webhook, and v2 admission then evaluates git-preview's workspace
    # resolution too — which fails closed with no_route when no rule covers it.
    webhook_secret_env: AICR_BROWSER_GIT_SECRET_PREVIEW

outputs:
  channels:
    - name: pr-comments
      kind: gitea_pr_review
      trigger: git-main

workspaces:
  root: build/tmp/browser/workspaces
  instances:
    default-project:
      source_repo:
        trigger: git-main
        repo: acme/app

agent:
  sandbox:
    kind: native

config_sources:
  # Fail-closed secret policy: the UI may only reference envs the deployment
  # pre-authorized for an exact (target path, destination) pair. The browser
  # CRUD flow creates exactly this provider id/destination.
  secret_refs:
    - env: AICR_BROWSER_LLM_KEY
      target: [llm, providers, db-provider, api_key_env]
      destinations:
        kind: openai_compatible
        base_url: http://127.0.0.1:9/v1
    # Same grant for the E03 copy-as-new save leg: a copy of file-llm saved
    # with id copied-llm carries over the identical env/destination pair.
    - env: AICR_BROWSER_LLM_KEY
      target: [llm, providers, copied-llm, api_key_env]
      destinations:
        kind: openai_compatible
        base_url: http://127.0.0.1:9/v1
    # Preset-prefill leg: the provider is created from the Kimi For Coding
    # Anthropic-compatible preset (id/kind/base_url prefilled), then its
    # api_key_env is rewritten to the fixture key before saving.
    - env: AICR_BROWSER_LLM_KEY
      target: [llm, providers, kimi-for-coding-anthropic, api_key_env]
      destinations:
        kind: anthropic
        base_url: https://api.kimi.com/coding
    # P7 run isolation leg: channels bound to the stub-gitea triggers inherit
    # the trigger's token_env; each binding is a distinct (target, destination)
    # pair and needs its own grant.
    - env: AICR_BROWSER_GIT_TOKEN
      target: [outputs, channels, c-iso-a, token_env]
      destinations:
        kind: gitea_pr_review
        trigger: git-main
        trigger_destination:
          kind: gitea
          base_url: http://127.0.0.1:9399
    - env: AICR_BROWSER_GIT_TOKEN
      target: [outputs, channels, c-iso-b, token_env]
      destinations:
        kind: gitea_pr_review
        trigger: git-preview
        trigger_destination:
          kind: gitea
          base_url: http://127.0.0.1:9398
  database:
    enabled: true
    backend: storage
    namespace: browser-test

storage:
  retention:
    events:
      max_count: 1500
      max_age_months: 3
  database:
    kind: sqlite
    sqlite:
      path: build/tmp/browser/aicr.sqlite

queue:
  kind: memory

server:
  port: 18080
  hostname: 127.0.0.1
